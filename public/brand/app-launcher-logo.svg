<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Cloudflare Field Notes</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <!-- Pen outline (local coordinates, pointing down) -->
    <path id="pen" d="M-26 -92 h52 v120 l-26 40 l-26 -40 z"/>
    <!-- Cut a gap around the pen so it reads on top of the cloud -->
    <mask id="cut" maskUnits="userSpaceOnUse" x="-64" y="-64" width="640" height="640">
      <rect x="-64" y="-64" width="640" height="640" fill="#fff"/>
      <use href="#pen" transform="translate(372 374) rotate(45)" fill="#000" stroke="#000" stroke-width="22" stroke-linejoin="round"/>
    </mask>
  </defs>

  <!-- Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g transform="translate(-22 -10)">
  <!-- Cloud with note lines -->
  <g mask="url(#cut)">
    <path fill="#fff" d="M172 328 H360 A60 60 0 0 0 373.9 209.7 A98 98 0 0 0 179.6 196.5 A66 66 0 0 0 172 328 Z"/>
    <g stroke="#ea580c" stroke-width="18" stroke-linecap="round">
      <line x1="198" y1="232" x2="352" y2="232"/>
      <line x1="184" y1="270" x2="330" y2="270"/>
      <line x1="184" y1="306" x2="282" y2="306"/>
    </g>
  </g>

  <!-- Pen -->
  <g transform="translate(372 374) rotate(45)" fill="#fff">
    <rect x="-26" y="-92" width="52" height="22" rx="6"/>
    <rect x="-26" y="-62" width="52" height="90"/>
    <path d="M-26 36 h52 l-26 32 z"/>
  </g>
  </g>
</svg>
